# shared/auth/pyproject.toml
[tool.poetry]
name = "auth-core"
version = "0.1.0"
description = "Shared authentication core service layer"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.111.0"
pydantic = ">=2.7.0"
python-dotenv = ">=1.0.0"
python-jose = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
